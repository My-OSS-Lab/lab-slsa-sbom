name: Keyless Artifact Signing with Cosign

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Package application
      - name: Package Release Artifact
        run: |
          tar -czvf release.tar.gz main.py requirements.txt
          sha256sum release.tar.gz > release.tar.gz.sha256
          echo "Artifact packaged successfully."

      # 3. Install Cosign
      - name: Install Sigstore Cosign
        uses: sigstore/cosign-installer@v4.1.2

      # 4. Sign artifact using OIDC (Keyless)
      - name: Sign Artifact Keylessly
        run: |
          cosign sign-blob \
            --bundle release.tar.gz.sigstore.json \
            --yes \
            release.tar.gz

          echo "Keyless signing completed successfully."

      # 5. Verify artifact signature
      - name: Verify Signed Artifact
        run: |
          cosign verify-blob \
            --bundle release.tar.gz.sigstore.json \
            --certificate-identity \
            "https://github.com/${{ github.repository }}/.github/workflows/cosign-sign.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            release.tar.gz

          echo "Artifact signature verified successfully."

      # 6. Upload signed artifacts
      - name: Upload Signed Artifacts Package
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-package
          path: |
            release.tar.gz
            release.tar.gz.sigstore.json
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
